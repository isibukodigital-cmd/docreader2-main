name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DOCQA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DOCQA_PORTABLE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/docqa_portable_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create Supabase-compatible SQL test fixtures
        run: psql "$DOCQA_TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=tests/sql/ci_supabase_standins.sql
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run PostgreSQL migration integration test
        shell: pwsh
        run: ./tests/run_sql_integration.ps1
      - name: Create a fresh generic PostgreSQL test database
        run: psql "$DOCQA_TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --command="CREATE DATABASE docqa_portable_test"
      - name: Run the one-command portable database setup
        run: |
          python scripts/setup_database.py --provider postgres --database-url "$DOCQA_PORTABLE_TEST_DATABASE_URL" --yes
          python scripts/setup_database.py --provider postgres --database-url "$DOCQA_PORTABLE_TEST_DATABASE_URL" --yes
      - name: Verify the provider-neutral PostgreSQL schema
        run: psql "$DOCQA_PORTABLE_TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=tests/sql/postgres_setup_integration.sql
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Format and validate AWS Terraform
        run: |
          terraform fmt -check -recursive deploy/aws
          terraform -chdir=deploy/aws/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=deploy/aws/terraform validate
          terraform -chdir=deploy/aws/terraform-state init -backend=false -input=false -lockfile=readonly
          terraform -chdir=deploy/aws/terraform-state validate
