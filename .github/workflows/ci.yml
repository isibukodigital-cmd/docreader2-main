name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DOCQA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DOCQA_PORTABLE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/docqa_portable_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create Supabase-compatible SQL test fixtures
        run: psql "$DOCQA_TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=tests/sql/ci_supabase_standins.sql
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run PostgreSQL migration integration test
        shell: pwsh
        run: ./tests/run_sql_integration.ps1
      - name: Create a fresh generic PostgreSQL test database
        run: psql "$DOCQA_TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --command="CREATE DATABASE docqa_portable_test"
      - name: Run the one-command portable database setup
        run: |
          python scripts/setup_database.py --provider postgres --database-url "$DOCQA_PORTABLE_TEST_DATABASE_URL" --yes
          python scripts/setup_database.py --provider postgres --database-url "$DOCQA_PORTABLE_TEST_DATABASE_URL" --yes
      - name: Verify the provider-neutral PostgreSQL schema
        run: psql "$DOCQA_PORTABLE_TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 --file=tests/sql/postgres_setup_integration.sql
      - name: Validate SSM deployment script syntax
        run: bash -n deploy/aws/ssm-deploy.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Format and validate AWS Terraform
        run: |
          terraform fmt -check -recursive deploy/aws
          terraform -chdir=deploy/aws/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=deploy/aws/terraform validate
          terraform -chdir=deploy/aws/terraform-state init -backend=false -input=false -lockfile=readonly
          terraform -chdir=deploy/aws/terraform-state validate

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: docreader-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment settings
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_ACCOUNT_ID"
          test -n "$ECR_REPOSITORY"
          test -n "$EC2_INSTANCE_ID"
          test -n "$AWS_ROLE_ARN"
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:git-${{ github.sha }}
      - name: Deploy through Systems Manager and verify health
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:git-${{ github.sha }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          script_b64="$(base64 -w 0 deploy/aws/ssm-deploy.sh)"
          command="printf '%s' '${script_b64}' | base64 -d > /tmp/docreader-ssm-deploy.sh && bash /tmp/docreader-ssm-deploy.sh '${IMAGE_URI}' '${AWS_REGION}' '${AWS_ACCOUNT_ID}' '/home/ubuntu/docreader2-main/deploy'"
          parameters="$(jq -cn --arg command "$command" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy DocReader commit ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM command: $command_id"

          status=Pending
          for attempt in $(seq 1 90); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                break
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json || true
            echo "Deployment failed or timed out (SSM status: $status)." >&2
            exit 1
          fi
