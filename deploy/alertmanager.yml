global:
  resolve_timeout: 5m

route:
  receiver: human-notifications
  group_by:
    - alertname
    - severity
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: human-notifications
    webhook_configs:
      - url: "${ALERTMANAGER_WEBHOOK_URL}"
        send_resolved: true
